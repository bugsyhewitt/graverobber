# goreleaser configuration for graverobber.
# Schema: goreleaser v2. Docs: https://goreleaser.com
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: graverobber
    main: ./cmd/graverobber
    binary: graverobber
    env:
      - CGO_ENABLED=0
    # version is a package-level var in package main; the linker rewrites it.
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # windows/arm64 is not a target for a recon CLI; drop the combination.
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: graverobber
    formats: [tar.gz]
    # Windows users generally expect a zip.
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"

release:
  draft: false
  prerelease: auto
